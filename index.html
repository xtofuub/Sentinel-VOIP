<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    (() => {
      let systemPrefersReduced = true

      try {
        systemPrefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches
      } catch {
        // Reduced motion is the safest fallback when preference detection fails.
      }

      try {
        const storedMode = window.localStorage.getItem("sentinel-motion")
        document.documentElement.dataset.motion =
          storedMode === "full" || storedMode === "reduced"
            ? storedMode
            : systemPrefersReduced
              ? "reduced"
              : "full"
      } catch {
        document.documentElement.dataset.motion = systemPrefersReduced ? "reduced" : "full"
      }
    })()
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/favicon.png" />
  <link rel="mask-icon" href="/favicon.svg" color="#ff4500" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="Sentinel VOIP operations workspace for scenario selection, backend task submission, activity, and request diagnostics." />
  <title>Sentinel VOIP — Operations Workspace</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
